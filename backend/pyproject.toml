[project]
name = "career-copilot-backend"
version = "1.0.0"
description = "AI Career Copilot — Google ADK multi-agent backend"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.30.0",
    "google-generativeai>=0.8.0",
    "google-auth>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pypdf>=5.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["career_copilot*", "api*", "trends_agent*"]
